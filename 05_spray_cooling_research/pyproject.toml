[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spray-cooling-research"
version = "0.1.0"
description = "Robotic spray-cooling simulation using JAX, JAX-PULSE, PyVista, and UR5e inverse kinematics."
requires-python = ">=3.12"
dependencies = [
    "numpy==2.4.6",
    "pyvista==0.44.2",
    "vtk==9.3.1",
    "matplotlib==3.10.9",
    "trimesh==4.12.2",
    "ikpy==4.0.0",
    "robot-descriptions==3.0.0",
    "yourdfpy==0.0.60",
    "xacrodoc==2.0.1",
]

[project.optional-dependencies]
cpu = [
    "jax==0.10.1",
]
cuda12 = [
    "jax[cuda12]==0.10.1",
]
cuda13 = [
    "jax[cuda13]==0.10.1",
]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "spray_cooling*",
    "relevant_PULSE_files*",
]
