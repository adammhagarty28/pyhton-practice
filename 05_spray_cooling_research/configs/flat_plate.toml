[simulation]
dt_s = 0.1
end_time_s = 600.0

[thermal]
initial_temperature_c = 900.0
ambient_temperature_c = 25.0
thermal_conductivity_w_mk = 50.0     # legacy constant fallback [W/(m K)]
density_kg_m3 = 7850.0               # [kg/m^3] AISI 1045
specific_heat_j_kgk = 500.0          # legacy constant fallback [J/(kg K)]
ambient_h_w_m2k = 15.0               # [W/(m^2 K)] natural convection to still air
spray_h_scale_w_m2k = 2000.0         # legacy [W/(m^2 K)]; new boiling curve overrides
thickness_m = 0.020                  # [m] plate thickness (20 mm)

# T-dependent property tables (Incropera Table A.1, AISI 1010 as proxy)
temp_table_k       = [300.0, 400.0, 600.0, 800.0, 1000.0, 1200.0]  # [K]
k_table_w_mk       = [ 63.9,  58.7,  48.8,  39.2,   31.3,   28.0]  # [W/(m K)]
cp_table_j_kgk     = [434.0, 487.0, 559.0, 685.0, 1168.0,  600.0]  # [J/(kg K)]
emissivity_table   = [ 0.70,  0.73,  0.78,  0.82,   0.85,   0.85]  # [-]

# Volume mesh layer thicknesses, top -> bottom (must sum to thickness_m)
layer_thicknesses_m = [0.0010, 0.0020, 0.0030, 0.0040, 0.0050, 0.0050]  # [m]

[radiation]
stefan_boltzmann_w_m2k4 = 5.670374419e-8   # [W/(m^2 K^4)]

[spray]
sigma = 0.15
a = 1.0
reference_distance_m = 0.4
resolution = 64
field_of_view_deg = 90.0
volumetric_flow_rate_m3_s = 1.0e-5

# Boiling curve h(T_surface_C): piecewise linear (Option B generic)
boiling_temp_table_c   = [  25.0,  100.0,  200.0,  300.0,  400.0,  500.0,  900.0]  # [C]
boiling_h_table_w_m2k  = [3000.0, 3000.0,30000.0,40000.0,15000.0, 3000.0, 2000.0]  # [W/(m^2 K)]

[control]
# Hysteresis disabled for pure snake pattern (industrial reality).
# delta_off_fraction huge -> spray zone can never satisfy the OFF condition.
delta_off_fraction = 100.0   # [-] effectively disabled (spray never turns off)
delta_on_fraction  = 0.001   # [-] tiny positive; must be > 0 per config validator
spray_ramp_tau_s   = 0.05    # [s] near-instant valve (still smooth for viz)

[geometry]
mesh_path = "data/meshes/refined_plate.obj"
plate_size_m = 0.4
plate_center_m = [0.6, 0.0, -0.15]

[path]
points_per_row = 20
number_of_rows = 20
edge_margin_m = 0.01
nozzle_world_z_m = 0.25

[robot]
description = "ur5e_description"
base_position_m = [0.0, 0.0, 0.0]
visual_nozzle_length_m = 0.22
